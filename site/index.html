<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해병대 전사(戰史) 디지털 연표</title>
<style>
:root{
  --red:#a3121f; --red-d:#7a0c16; --gold:#f2b705; --gold-l:#fff5d6; --ink:#1d1d1f; --sub:#5b5b63;
  --bg:#f6f4f0; --card:#ffffff; --line:#d9d4ca; --shadow:0 2px 10px rgba(0,0,0,.08);
  --ok:#0a7a3a; --ok-l:#e6f6ec; --no:#b3261e; --no-l:#fdeceb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
img{max-width:100%;display:block}

/* 헤더 */
.top{background:var(--red);color:#fff;border-bottom:4px solid var(--gold);position:sticky;top:0;z-index:20}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px}
.brand{font-weight:800;font-size:1.02rem;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:8px;min-width:0}
.brand .mark{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--red-d);font-size:.85rem;font-weight:900}
.brand .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .spacer{flex:1}
.pill{flex:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:3px 11px;font-size:.85rem;text-decoration:none;white-space:nowrap}
.pill:hover{background:rgba(255,255,255,.25)}
@media (max-width:520px){ .brand .nm{display:none} }

main{max-width:1100px;margin:0 auto;padding:20px 16px 56px}
.hero h1{font-size:1.65rem;margin:8px 0 4px;letter-spacing:-.03em}
.hero p{margin:0 0 16px;color:var(--sub)}

/* 대상자 선택 */
.who{min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:center;padding:24px 0}
.who .kick{color:var(--red);font-weight:800;letter-spacing:.05em}
.who h1{font-size:clamp(1.7rem,4.5vw,2.6rem);margin:6px 0 6px;letter-spacing:-.03em}
.who>p{color:var(--sub);margin:0 0 24px}
.who-grid{display:grid;gap:14px}
@media (min-width:760px){.who-grid{grid-template-columns:repeat(3,1fr)}}
.who-card{background:#fff;border:2px solid transparent;border-radius:14px;box-shadow:var(--shadow);padding:20px 18px;text-align:left;transition:transform .15s,border-color .15s}
.who-card:hover,.who-card:focus-visible{transform:translateY(-3px);border-color:var(--red);outline:none}
.who-card.on{border-color:var(--red)}
.who-card .ic{font-size:2.2rem;line-height:1}
.who-card b{display:block;font-size:1.2rem;margin:10px 0 4px}
.who-card span{color:var(--sub);font-size:.93rem}
.who small{display:block;margin-top:18px;color:var(--sub)}

/* 필터 */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}

/* 연표 */
.timeline{position:relative;padding-left:28px}
.timeline::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:3px;background:linear-gradient(var(--red),var(--gold))}
.era{position:relative;margin:28px 0 12px;font-weight:800;color:var(--red);font-size:1.05rem}
.era::before{content:"";position:absolute;left:-26px;top:50%;width:17px;height:17px;margin-top:-8px;border-radius:50%;background:var(--gold);border:3px solid var(--red)}
.item{position:relative;margin:0 0 18px}
.item::before{content:"";position:absolute;left:-24px;top:22px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--red)}
.card{display:block;background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;text-decoration:none;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.card .ph{aspect-ratio:16/9;background:#2b2b2b center/cover no-repeat}
.card .bd{padding:12px 14px 14px}
.card .date{font-size:.85rem;color:var(--sub)}
.card h2{margin:2px 0 4px;font-size:1.2rem;letter-spacing:-.02em}
.card p{margin:0;font-size:.95rem}
.card .go{display:inline-block;margin-top:8px;color:var(--red);font-weight:700;font-size:.9rem}
.badge{display:inline-block;font-size:.75rem;font-weight:700;border-radius:4px;padding:1px 7px;margin-right:4px;vertical-align:1px}
.badge.war{background:#fde9c2;color:#6b4a00}
.badge.draft{background:#ffe1e1;color:var(--red-d)}
.badge.qz{background:#e8eefc;color:#1f3f8f}
.badge.qz.done{background:var(--ok-l);color:var(--ok)}
.badge.mem{background:#2a2a2a;color:#fff}
.empty{color:var(--sub);padding:24px 0}
.reveal .item{opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s ease}
.reveal .item.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal .item{opacity:1;transform:none;transition:none}}
@media (min-width:860px){
  .timeline{padding-left:0}
  .timeline::before{left:50%;margin-left:-1.5px}
  .era{text-align:center;margin:36px 0 18px}
  .era span{background:var(--bg);padding:0 12px;position:relative;z-index:1}
  .era::before{display:none}
  .item{width:50%;padding-right:36px}
  .item.r{margin-left:50%;padding-right:0;padding-left:36px}
  .item::before{left:auto;right:-8px;top:26px}
  .item.r::before{right:auto;left:-8px}
}

/* 상세 */
.back{display:inline-block;margin:0 0 12px;color:var(--red);font-weight:700;text-decoration:none}
.notice{background:#fff4f4;border:1px solid #f3c1c1;color:var(--red-d);border-radius:8px;padding:10px 14px;margin:0 0 16px;font-size:.92rem}
.memorial{background:#1f1f22;color:#eee;border-left:6px solid #000;border-radius:8px;padding:12px 16px;margin:0 0 16px;display:flex;gap:10px;align-items:center}
.memorial .rb{font-size:1.4rem}
.dhead{display:grid;gap:16px}
.dhead>*{min-width:0}
.dhead .cover{border-radius:12px;overflow:hidden;background:#222;box-shadow:var(--shadow)}
/* 기록 사진은 자르지 않고 전체를 보여 줌 (워터마크·출처 보존). 남는 부분은 어두운 바탕 */
.dhead .cover{background:#1b1b1d}
.dhead .cover img{width:100%;aspect-ratio:4/3;object-fit:contain}
.dhead h1{margin:4px 0 6px;font-size:1.8rem;letter-spacing:-.03em}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 14px;font-size:.95rem}
.meta dt{color:var(--sub)}
.meta dd{margin:0}
.btn-edu{background:var(--red);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700;font-size:1rem}
.btn-edu:hover{background:var(--red-d)}
@media (min-width:860px){.dhead{grid-template-columns:1.2fr 1fr;align-items:start}}
.story{position:relative;background:var(--gold-l);border:1px solid #f0d98a;border-radius:14px;padding:16px 18px 14px;margin:20px 0 0;font-size:1.05rem}
.story .who-l{font-size:.82rem;font-weight:800;color:#7a5a00;margin-bottom:4px}
.story p{margin:0}
.calm .story{background:#f1f1f1;border-color:#ddd}
.calm .story .who-l{color:#444}
section.blk{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin:18px 0}
section.blk h2{font-size:1.15rem;margin:0 0 10px;padding-left:10px;border-left:4px solid var(--red)}
section.blk p{margin:0 0 8px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;position:relative}
.steps li.st{position:relative;padding:0 0 18px 44px;counter-increment:s}
.steps li.st::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem;z-index:1}
.steps li.st::after{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:#e6c9cc}
.steps li.st:last-of-type::after{display:none}
.steps li.st b{display:block}
.steps li.qz{padding:0 0 18px 44px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gallery button{border:0;padding:0;background:#fff;text-align:left;border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.gallery .th{aspect-ratio:4/3;background:#2b2b2b center/cover no-repeat}
.gallery .cap{padding:8px 10px;font-size:.88rem}
.gallery .src{color:var(--sub);font-size:.78rem;margin-top:2px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.pager a{flex:1;background:#fff;border-radius:8px;padding:10px 14px;text-decoration:none;box-shadow:var(--shadow);font-size:.92rem}
.pager a.next{text-align:right}
.pager small{display:block;color:var(--sub)}

/* 용어 풀이 */
.term{background:none;border:0;padding:0;border-bottom:2px dotted var(--red);font-weight:600;line-height:1.3}
.term:hover{background:var(--gold-l)}
.tip{position:absolute;z-index:40;max-width:300px;background:#222;color:#fff;border-radius:8px;padding:10px 12px;font-size:.9rem;line-height:1.55;box-shadow:0 6px 18px rgba(0,0,0,.25);display:none}
.tip b{color:var(--gold);display:block}

/* 퀴즈 */
.quiz{background:#f4f7ff;border:1px solid #cfdaf5;border-radius:12px;padding:14px 16px}
.calm .quiz{background:#f5f5f5;border-color:#ddd}
.quiz .qh{font-size:.8rem;font-weight:800;color:#1f3f8f;letter-spacing:.04em}
.calm .quiz .qh{color:#444}
.quiz .qq{font-weight:700;font-size:1.03rem;margin:4px 0 10px}
.opts{display:grid;gap:8px}
.opts.ox{grid-template-columns:1fr 1fr}
.opt{background:#fff;border:1.5px solid #c9d3ea;border-radius:8px;padding:9px 12px;text-align:left;font-size:.97rem;transition:background .12s}
.opts.ox .opt{text-align:center;font-size:1.1rem;font-weight:800}
.opt:hover:not(:disabled){background:#eaf0ff}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-l);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--no-l);border-color:var(--no);color:var(--no)}
.fb{margin-top:10px;font-size:.95rem;display:none}
.fb.on{display:block}
.fb .res{font-weight:800}
.fb .res.ok{color:var(--ok)}
.fb .res.no{color:var(--no)}
.fb .again{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:.85rem;padding:0;margin-left:6px}
.qend .quiz{margin-bottom:12px}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.quiz.done-ok{animation:pop .35s ease}
.calm .quiz.done-ok{animation:none}

/* 신뢰 수준·근거 */
.lv{display:inline-block;font-size:.72rem;font-weight:700;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px;line-height:1.6}
.lv.confirmed{background:#e3f4e9;color:#0a6b2d}
.lv.estimated{background:#fff1cc;color:#7a5200}
.lv.disputed{background:#efe6fb;color:#5b2a9a}
.fn{font-size:.72rem;vertical-align:super;margin-left:2px;color:var(--red);text-decoration:none;font-weight:700}
.srcs{list-style:none;margin:0;padding:0;font-size:.92rem}
.srcs li{padding:6px 0;border-bottom:1px solid #eee}
.srcs li:target{background:var(--gold-l)}
.srcs .pos{color:var(--sub);font-size:.85rem;margin-right:4px}
.legend{font-size:.82rem;color:var(--sub);margin:0 0 8px}
.legend .lv{margin:0 4px 0 0}

/* 결심 시나리오 */
.dec{background:#1f2430;color:#f3f3f3;border-radius:12px;padding:14px 16px;border-left:5px solid var(--gold)}
.calm .dec{background:#2b2b2b;border-left-color:#999}
.dec .dh{font-size:.8rem;font-weight:800;color:var(--gold);letter-spacing:.04em}
.calm .dec .dh{color:#ddd}
.dec .ds{font-weight:600;margin:4px 0 10px}
.dec .dopts{display:grid;gap:8px}
.dec .dopt{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:9px 12px;text-align:left}
.dec .dopt:hover:not(:disabled){background:rgba(255,255,255,.15)}
.dec .dopt:disabled{cursor:default}
.dec .dopt.mine{border-color:#8ab4ff;background:rgba(138,180,255,.15)}
.dec .dopt.actual{border-color:var(--gold);background:rgba(242,183,5,.18)}
.dec .dopt .tag{font-size:.75rem;font-weight:800;margin-left:6px;color:var(--gold)}
.dec .dopt.mine .tag.me{color:#8ab4ff}
.dec .dres{display:none;margin-top:12px;font-size:.95rem;line-height:1.65}
.dec .dres.on{display:block}
.dec .dres p{margin:0 0 8px}
.dec .dres b{color:var(--gold)}
.dec details{margin-top:6px;font-size:.88rem;color:#ccc}
.dec .again{background:none;border:0;color:#aaa;text-decoration:underline;font-size:.85rem;padding:0;margin-top:4px}

/* 개정 이력 */
.revline{font-size:.85rem;color:var(--sub);margin:-4px 0 10px}
.revline a{color:var(--sub)}
details.revs{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:12px 18px;margin:18px 0}
details.revs summary{cursor:pointer;font-weight:700}
.revlist{list-style:none;margin:8px 0 0;padding:0;font-size:.92rem}
.revlist li{padding:8px 0;border-top:1px solid #eee}
.revlist .d{font-weight:700;margin-right:6px}
.revlist .w{display:inline-block;font-size:.75rem;background:#eee;border-radius:4px;padding:0 6px;margin-right:6px}
.revlist .bs{display:block;color:var(--sub);font-size:.85rem}
footer a{color:var(--sub)}

/* 확대 보기 / 모달 */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.lb.on{display:flex}
.lb figure{margin:0;max-width:1100px;width:100%;color:#fff}
.lb img{max-height:72vh;margin:0 auto;object-fit:contain}
.lb figcaption{margin-top:10px;font-size:.95rem}
.lb .src{color:#ccc;font-size:.85rem}
.lb .x{position:absolute;top:10px;right:14px;background:transparent;color:#fff;border:0;font-size:2rem;line-height:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:24px 22px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.modal .medal{font-size:3.4rem;line-height:1}
.modal h3{margin:8px 0 4px;font-size:1.35rem}
.modal p{margin:0 0 6px;color:var(--sub)}
.modal ul{list-style:none;padding:0;margin:12px 0;text-align:left;font-size:.93rem}
.modal li{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:6px 2px}
.modal .acts{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.modal .acts button{border-radius:8px;padding:8px 16px;border:1px solid var(--line);background:#fff}
.modal .acts button.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}

/* 교육 모드 */
.edu{position:fixed;inset:0;background:#111;color:#fff;z-index:60;display:none;user-select:none}
.edu.on{display:block}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:6vh 8vw 10vh}
/* 글자 크기는 화면 폭(vw)과 높이(vh) 중 작은 쪽을 따름 → 1280×720 같은 낮은 화면에서도 넘치지 않음 */
.slide h2{font-size:clamp(1.6rem,min(4.2vw,7vh),3.4rem);margin:0 0 3vh;letter-spacing:-.03em;color:var(--gold)}
.slide p,.slide li{font-size:clamp(1.05rem,min(2.4vw,4vh),2rem);line-height:1.55;margin:0 0 1.2vh}
.slide .kicker{font-size:clamp(1rem,1.8vw,1.4rem);color:#ddd;margin-bottom:1vh}
.slide.cover{background:#000 center/cover no-repeat;justify-content:flex-end}
.slide.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,rgba(0,0,0,.85))}
.slide.cover>*{position:relative}
.slide.cover h2{font-size:clamp(2.4rem,6vw,5rem);color:#fff}
.slide.story-s p{font-size:clamp(1.3rem,2.9vw,2.4rem);font-style:normal}
.slide.story-s .lbl{color:var(--gold);font-size:clamp(1rem,1.8vw,1.4rem);margin-bottom:2vh}
.slide.photo{padding:3vh 4vw 10vh;align-items:center}
.slide.photo img{max-height:70vh;max-width:100%;object-fit:contain}
.slide.photo .cap{margin-top:2vh;text-align:center;font-size:clamp(1rem,1.8vw,1.5rem)}
.slide.photo .cap small{display:block;color:#bbb;font-size:.75em}
.slide .stepno{display:inline-block;background:var(--red);border-radius:6px;padding:2px 12px;font-size:clamp(1rem,1.8vw,1.4rem);margin-bottom:2vh}
.slide .sopts{display:grid;gap:1.6vh;margin-top:1vh}
.slide .sopts.ox{grid-template-columns:1fr 1fr;max-width:900px}
.slide .so{border:2px solid rgba(255,255,255,.35);border-radius:10px;padding:1.4vh 1.6vw;font-size:clamp(1rem,min(2.2vw,3.6vh),1.9rem);background:rgba(255,255,255,.04)}
.slide .sopts.ox .so{text-align:center;font-size:clamp(1.8rem,min(5vw,8vh),4rem);font-weight:900}
.slide.qs h2{font-size:clamp(1.4rem,min(3.4vw,6vh),3rem);margin-bottom:2.4vh}
@media (min-width:900px){ .slide .sopts.mc{grid-template-columns:1fr 1fr} }
.slide .so.right{border-color:#4cd07d;background:rgba(76,208,125,.18)}
.slide .sexp{margin-top:2.4vh;color:#cfe9d8;font-size:clamp(.95rem,min(2vw,3.2vh),1.6rem);visibility:hidden}
.slide .sexp.on{visibility:visible}
.slide .hint{margin-top:2vh;color:#999;font-size:clamp(.9rem,1.4vw,1.1rem)}
.slide .slv{display:inline-block;margin-left:12px;font-size:clamp(.9rem,1.4vw,1.1rem);color:#e6d3ff;border:1px solid #b99be6;border-radius:6px;padding:0 10px;vertical-align:middle}
.slide.decs h2{color:#fff;font-size:clamp(1.2rem,min(2.5vw,4.4vh),2.1rem);line-height:1.45;margin-bottom:2vh}
.slide.decs .so{font-size:clamp(.95rem,min(1.8vw,3vh),1.5rem);padding:1vh 1.4vw}
.slide.decs .sexp{font-size:clamp(.9rem,min(1.6vw,2.8vh),1.35rem)}
.slide .dk{display:inline-block;background:var(--gold);color:#222;border-radius:6px;padding:2px 12px;font-weight:800;font-size:clamp(1rem,1.8vw,1.4rem);margin-bottom:2vh}
.slide .so .snote{display:block;font-size:.62em;color:#ccc;margin-top:.6vh;visibility:hidden}
.slide .so.revealed .snote{visibility:visible}
.slide .so.actual{border-color:var(--gold);background:rgba(242,183,5,.16)}
.slide .memline{margin-top:2vh;color:#ddd;font-size:clamp(1rem,1.6vw,1.3rem)}
.edu .bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:.95rem;color:#ddd}
.edu .bar .sp{flex:1}
.edu .bar button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:6px;padding:6px 12px}
.edu .prog{position:absolute;left:0;top:0;height:4px;background:var(--gold);transition:width .2s}

footer{border-top:1px solid var(--line);color:var(--sub);font-size:.85rem}
footer .in{max-width:1100px;margin:0 auto;padding:16px}

/* ===== 차분한 화면 (밝고, 화려하지 않게) — 위 규칙을 덮어씀 ===== */
:root{
  --red:#8e2a2f; --red-d:#6f1f24; --gold:#b8963a; --gold-l:#f7f1e1; --ink:#26262a; --sub:#66666e;
  --bg:#f7f6f2; --line:#e2ddd2; --shadow:0 1px 4px rgba(0,0,0,.06);
}
.top{background:#fff;color:var(--ink);border-bottom:3px solid var(--red);box-shadow:0 1px 0 var(--line)}
.brand .mark{background:var(--red);color:#fff}
.pill{background:#fff;border:1px solid var(--line);color:var(--ink)}
.pill:hover{background:#f3f1ec}
.timeline::before{background:#d8d1c3}
.era::before{background:#fff;border-color:var(--red)}
.card:hover,.who-card:hover,.who-card:focus-visible{transform:none;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.reveal .item{transform:translateY(8px);transition:opacity .35s ease,transform .35s ease}
.who-card .ic{color:var(--red);font-size:2rem}
.story .who-l .aico,.slide .lbl .aico{vertical-align:-2px;margin-right:2px}
.story{border-color:#e8dcb8}
.story .who-l{color:#6f5a1c}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.badge.mem{background:#ebe9e4;color:#444}
.memorial{background:#f1f0ec;color:#333;border-left:5px solid #555}
.memorial .rb{font-size:.78rem;font-weight:800;background:#444;color:#fff;border-radius:4px;padding:1px 8px}
.quiz{background:#f6f8fb;border-color:#dde3ec}
.quiz .qh{color:#3d5a91}
.opt{border-color:#d3dae6}
.opt:hover:not(:disabled){background:#eef2f8}
.quiz.done-ok{animation:none}
.tip{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.tip b{color:var(--red)}
.dec{background:#f9f7f2;color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--gold)}
.dec .dh{color:#6f5a1c}
.dec .dopt{background:#fff;border:1.5px solid #d9d3c5;color:var(--ink)}
.dec .dopt:hover:not(:disabled){background:#f4f0e6}
.dec .dopt.mine{border-color:#5b7bb5;background:#eef2fa}
.dec .dopt.actual{border-color:var(--gold);background:#f6efda}
.dec .dopt .tag{color:#6f5a1c}
.dec .dopt.mine .tag.me{color:#3d5a91}
.dec .dres b{color:#6f5a1c}
.dec details,.dec .again{color:var(--sub)}
.calm .dec{background:#f4f4f2;border-left-color:#999}
.calm .dec .dh{color:#555}
.lb{background:rgba(32,32,34,.86)}
.modal{background:rgba(0,0,0,.35)}
.modal .medal{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;border:2px solid var(--line);color:var(--sub);font-size:1.4rem;font-weight:800}
.modal .medal.done{border-color:var(--red);color:var(--red)}
/* 교육 모드: 밝은 바탕 (강의실 프로젝터에서도 읽기 쉬운 짙은 글자) */
.edu{background:#faf9f6;color:var(--ink)}
.slide h2{color:var(--red-d)}
.slide .kicker{color:var(--sub)}
.slide.cover{background-color:#ddd}
.slide.cover::before{background:linear-gradient(transparent 35%,rgba(0,0,0,.62))}
.slide.cover .kicker,.slide.cover p,.slide .memline{color:#f2f2f2}
.slide.story-s .lbl{color:#6f5a1c}
.slide.photo .cap small{color:var(--sub)}
.slide .so{border:2px solid #d9d3c5;background:#fff;color:var(--ink)}
.slide .so.right{border-color:#2e7d4f;background:#e8f3ec}
.slide .sexp{color:#245c3c}
.slide .hint{color:#888}
.slide .slv{color:#5b2a9a;border-color:#cdb8ea;background:#f6f0fd}
.slide.decs h2{color:var(--ink)}
.slide .dk{background:var(--gold-l);color:#6f5a1c;border:1px solid #e0cf9e}
.slide .so .snote{color:var(--sub)}
.slide .so.actual{border-color:var(--gold);background:#f6efda}
.edu .bar{background:#fff;border-top:1px solid var(--line);color:var(--sub)}
/* 하단 조작 막대가 불투명해졌으므로, 슬라이드 내용이 막대 아래로 들어가지 않게 아래 여백을 막대 높이만큼 확보 */
.slide,.slide.photo{padding-bottom:calc(60px + 1vh)}
/* 정답 해설은 공개 전에는 자리를 차지하지 않게 하고, 공개 후에는 "다음을 누르면…" 안내를 숨김 */
.slide .sexp{display:none}
.slide .sexp.on{display:block}
.slide .hint:empty{display:none}
.edu .bar button{background:#f1efe9;color:var(--ink)}
.edu .prog{background:var(--red)}
/* AI 쉬운 설명 (온라인 배포판에서만 표시) */
.aibox{border:1px solid #d9dde3;background:#f7f8fa;border-radius:12px;padding:12px 16px;margin:16px 0 0}
.aibox .aih{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.aibox .aih b{font-size:.92rem;color:#3a4250}
.aibox button.aigo{border:1px solid #b9c0ca;background:#fff;border-radius:8px;padding:6px 14px;font-size:.92rem;cursor:pointer}
.aibox button.aigo:disabled{opacity:.6;cursor:wait}
.aibox ul{margin:10px 0 4px;padding-left:1.2em}
.aibox li{margin:3px 0}
.aibox .ainote{font-size:.78rem;color:#6b7280}
.aibox .aierr{color:#9a3412;font-size:.9rem;margin-top:8px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#/"><span class="mark">海</span><span class="nm">해병대 전사(戰史) 디지털 연표</span></a>
  <span class="spacer"></span>
  <a class="pill" id="audPill" href="#/who" title="보는 사람 바꾸기"></a>
  <button class="pill" id="qzPill" title="퀴즈 진행 상황"></button>
</div></header>
<main id="app"></main>
<footer><div class="in">해병대 군사연구소 · 자료 기준일 <span id="gen"></span> · <a href="#/log">개정 이력</a></div></footer>

<div class="tip" id="tip" role="tooltip"></div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="사진 확대 보기">
  <button class="x" id="lbx" aria-label="닫기">×</button>
  <figure><img id="lbimg" alt=""><figcaption id="lbcap"></figcaption></figure>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="mbox"></div></div>

<div class="edu" id="edu" aria-label="교육 모드">
  <div class="prog" id="prog"></div>
  <div id="stage"></div>
  <div class="bar"><span id="eduTitle"></span><span class="sp"></span><span id="counter"></span>
    <button id="ePrev" aria-label="이전">◀</button><button id="eNext" aria-label="다음">▶</button><button id="eExit">닫기 (ESC)</button></div>
</div>

<script src="data.js"></script>
<script>
(function(){
  var D = window.SITE_DATA || {battles:[]};
  var B = D.battles.slice().sort(function(a,b){return a.start < b.start ? -1 : 1;});
  B.forEach(function(b){ b.quizzes = b.quizzes || []; b.intro = b.intro || {}; b.lessons = b.lessons || {}; b.sources = b.sources || []; b.decisions = b.decisions || []; });
  var TERMS = D.terms || [], REVS = D.revisions || [];
  var LV = { confirmed:'확인', estimated:'추정', disputed:'기록마다 다름' };
  var app = document.getElementById('app');
  document.getElementById('gen').textContent = D.generatedAt || '-';
  var currentWar = '전체';

  /* 단색 선 아이콘 (이모지 대신, 차분한 화면용) */
  function ico(p){ return '<svg class="aico" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">'+p+'</svg>'; }
  var AUDS = {
    soldier: {icon:ico('<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/>'), label:'장병', desc:'선배 해병들의 이야기와 해병대 정신을 만나 봅니다.',
      title:'선배 해병들이 걸어온 길', lead:'6·25전쟁부터 연평도까지, 해병대가 지켜 온 바다와 땅의 이야기입니다. 전투를 눌러 선배들의 발자취를 따라가 보십시오.',
      story:'장병에게 들려주는 이야기', lesson:'해병의 정신'},
    officer: {icon:ico('<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.9 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>'), label:'간부·교육생', desc:'작전 배경, 지휘 결심, 전술적 교훈을 살펴봅니다.',
      title:'해병대 작전사 연표', lead:'각 전투의 배경과 지휘 결심을 살펴보고, 전술적 교훈과 토의 질문으로 정리해 보십시오.',
      story:'작전을 보는 관점', lesson:'전술적 교훈'},
    public: {icon:ico('<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2c3 .2 5.5 2.6 5.5 5.8"/>'), label:'일반 방문객', desc:'쉬운 이야기와 퀴즈로 해병대 역사를 알아봅니다.',
      title:'해병대 이야기 연표', lead:'교과서에서 짧게 지나간 전투들, 그 안의 사람들을 만나 보세요. 중간중간 퀴즈도 함께 풀어 보세요!',
      story:'알고 계셨나요?', lesson:'역사적 의미'}
  };

  /* 저장 (브라우저에만, 실패해도 동작) */
  function load(k,d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
  function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  var aud = load('rokmc_aud', null); if(!AUDS[aud]) aud = null;
  /* 주소 옵션: ?aud=soldier|officer|public → 대상자 바로 지정 (대상자별 QR코드·바로가기용)
                ?edu=n (+ &reveal=1)        → 전투 화면에서 교육 모드 n번째 슬라이드로 바로 열기 */
  var QS = {}; location.search.replace(/^\?/,'').split('&').forEach(function(kv){ var p = kv.split('='); if(p[0]) QS[decodeURIComponent(p[0])] = decodeURIComponent(p[1]||''); });
  if(AUDS[QS.aud]){ aud = QS.aud; save('rokmc_aud', aud); }
  var answers = load('rokmc_quiz', {});
  var badgeShown = load('rokmc_badge', {});

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var usedTerms = {};
  function gloss(s){
    var h = esc(s);
    TERMS.forEach(function(t,i){
      if(usedTerms[i]) return;
      var et = esc(t.term), k = h.indexOf(et);
      if(k < 0) return;
      // 이미 만든 버튼 태그 안쪽이면 건너뜀
      var lt = h.lastIndexOf('<', k), gt = h.lastIndexOf('>', k);
      if(lt > gt) return;
      usedTerms[i] = 1;
      h = h.slice(0,k) + '<button class="term" data-t="'+i+'">'+et+'</button>' + h.slice(k+et.length);
    });
    return h;
  }
  function paras(s,g){return String(s||'').split(/\n+/).filter(Boolean).map(function(p){return '<p>'+(g?gloss(p):esc(p))+'</p>';}).join('');}
  function fmt(d){ if(!d) return ''; var p=d.split('-'); return p[0]+'. '+(+p[1])+'. '+(+p[2])+'.'; }
  function period(b){ return b.end && b.end!==b.start ? fmt(b.start)+' ~ '+fmt(b.end) : fmt(b.start); }
  function cover(b){ return b.photos.filter(function(p){return p.cover;})[0] || b.photos[0]; }
  function draftBadge(b){ return b.status==='검수완료' ? '' : '<span class="badge draft">검수 중</span>'; }
  function wars(){ var w=[]; B.forEach(function(b){ if(w.indexOf(b.war)<0) w.push(b.war); }); return w; }
  function myQuizzes(b){ return b.quizzes.filter(function(q){ return q.target==='all' || q.target===aud; }); }
  function allMine(){ var a=[]; B.forEach(function(b){ a = a.concat(myQuizzes(b)); }); return a; }
  function introOf(b){ return aud && b.intro[aud] || ''; }
  function lessonOf(b){ return aud && b.lessons[aud] || b.lesson; }
  /* 교육 모드에 넣을 사진: 교육용 O로 표시한 사진이 있으면 그것만, 없으면 X를 뺀 앞의 5장 */
  var EDU_DEFAULT = 5;
  function eduPhotos(b){
    var marked = b.photos.filter(function(p){ return p.edu==='O'; });
    return marked.length ? marked : b.photos.filter(function(p){ return p.edu!=='X'; }).slice(0, EDU_DEFAULT);
  }
  /* 대상자별 교훈이 있을 때만 대상자 제목, 공통 문구일 때는 "의의와 교훈" */
  function lessonTitle(b){ return aud && b.lessons[aud] ? AUDS[aud].lesson : '의의와 교훈'; }
  function circled(n){ return '①②③④'.charAt(n); }
  function myDecisions(b){ return b.decisions.filter(function(d){ return d.target==='all' || d.target===aud; }); }
  function revsOf(b){ return REVS.filter(function(r){ return !r.battle || r.battle===b.id; }); }
  function battleName(id){ var x = B.filter(function(b){ return b.id===id; })[0]; return x ? x.name : id; }
  /* 근거: 개요(0) → 경과 순서로 각주 번호를 매김 */
  function numberSources(b){
    var list = b.sources.slice().sort(function(x,y){ return x.at - y.at; });
    list.forEach(function(s,i){ s.n = i+1; });
    return list;
  }
  function srcMarks(b, at){
    return b.sources.filter(function(s){ return s.at===at; }).map(function(s){
      return '<span class="lv '+s.level+'">'+LV[s.level]+'</span><a class="fn" href="#src-'+esc(b.id)+'-'+s.n+'" data-fn="'+s.n+'">['+s.n+']</a>';
    }).join('');
  }
  function revHtml(list, withBattle){
    return '<ul class="revlist">'+list.map(function(r){
      return '<li><span class="d">'+esc(fmt(r.date))+'</span>'+(withBattle?'<span class="w">'+esc(r.battle?battleName(r.battle):'전체')+'</span>':'')
        + esc(r.text)+(r.basis?'<span class="bs">근거: '+esc(r.basis)+'</span>':'')+'</li>';
    }).join('')+'</ul>';
  }

  /* 상단 표시 */
  function refreshTop(){
    var pill = document.getElementById('audPill'), qp = document.getElementById('qzPill');
    if(aud){ pill.style.display=''; pill.textContent = AUDS[aud].label+' ▾'; } else pill.style.display='none';
    var mine = allMine(), done = mine.filter(function(q){ return answers[q.id]; }).length;
    if(aud && mine.length){ qp.style.display=''; qp.textContent = (done===mine.length?'✓ ':'')+'퀴즈 '+done+'/'+mine.length; } else qp.style.display='none';
  }

  /* 첫 화면: 대상자 선택 */
  function renderWho(){
    document.title = '해병대 전사(戰史) 디지털 연표';
    var h = '<div class="who"><div class="kick">해병대 군사연구소</div><h1>어떤 분이신가요?</h1>'
      + '<p>보시는 분에 맞춰 이야기와 퀴즈를 준비했습니다.</p><div class="who-grid">';
    Object.keys(AUDS).forEach(function(k){
      var a = AUDS[k];
      h += '<button class="who-card'+(k===aud?' on':'')+'" data-a="'+k+'"><span class="ic">'+a.icon+'</span><b>'+a.label+'</b><span>'+a.desc+'</span></button>';
    });
    h += '</div><small>선택은 화면 위쪽에서 언제든 바꿀 수 있습니다.</small></div>';
    app.innerHTML = h;
    Array.prototype.forEach.call(app.querySelectorAll('.who-card'),function(el){
      el.onclick = function(){ aud = el.getAttribute('data-a'); save('rokmc_aud', aud); refreshTop(); if(location.hash==='#/') route(); else location.hash = '#/'; };
    });
  }

  /* 연표 */
  function renderTimeline(){
    var A = AUDS[aud];
    document.title = '해병대 전사(戰史) 디지털 연표';
    var list = B.filter(function(b){return currentWar==='전체'||b.war===currentWar;});
    var h = '<div class="hero"><h1>'+esc(A.title)+'</h1><p>'+esc(A.lead)+'</p></div>';
    h += '<div class="filters" role="group" aria-label="전쟁 구분">';
    ['전체'].concat(wars()).forEach(function(w){ h += '<button class="chip" data-war="'+esc(w)+'" aria-pressed="'+(w===currentWar)+'">'+esc(w)+'</button>'; });
    h += '</div><div class="timeline reveal">';
    if(!list.length) h += '<p class="empty">표시할 전투가 없습니다.</p>';
    var lastWar = null;
    list.forEach(function(b,k){
      if(b.war!==lastWar){ h += '<div class="era"><span>'+esc(b.war)+'</span></div>'; lastWar=b.war; }
      var c = cover(b), mq = myQuizzes(b), md = mq.filter(function(q){return answers[q.id];}).length;
      h += '<div class="item'+(k%2?' r':'')+'"><a class="card" href="#/b/'+encodeURIComponent(b.id)+'">'
        + '<div class="ph" style="background-image:url(\''+(c?esc(c.thumb):'')+'\')" role="img" aria-label="'+esc(c?c.title:'')+'"></div>'
        + '<div class="bd"><div class="date">'+esc(period(b))+'</div><h2>'+esc(b.name)+'</h2>'
        + '<div style="margin:0 0 6px"><span class="badge war">'+esc(b.war)+'</span>'+draftBadge(b)
        + (b.memorial?'<span class="badge mem">추모</span>':'')
        + (mq.length?'<span class="badge qz'+(md===mq.length?' done':'')+'">'+(md===mq.length?'✓ ':'')+'퀴즈 '+md+'/'+mq.length+'</span>':'')+'</div>'
        + '<p>'+esc(b.oneLine)+'</p><span class="go">이야기 보기 →</span></div></a></div>';
    });
    h += '</div>';
    app.innerHTML = h;
    Array.prototype.forEach.call(app.querySelectorAll('.chip'),function(el){
      el.onclick = function(){ currentWar = el.getAttribute('data-war'); renderTimeline(); };
    });
    var items = app.querySelectorAll('.reveal .item');
    if('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }); },{threshold:.12});
      Array.prototype.forEach.call(items,function(el){ io.observe(el); });
    } else Array.prototype.forEach.call(items,function(el){ el.classList.add('in'); });
  }

  /* 퀴즈 카드 */
  function quizHtml(q){
    var h = '<div class="quiz" data-q="'+esc(q.id)+'"><div class="qh">'+(q.type==='ox'?'OX 퀴즈':'퀴즈')+'</div>'
      + '<div class="qq">Q. '+esc(q.q)+'</div><div class="opts'+(q.type==='ox'?' ox':'')+'">';
    q.options.forEach(function(o,i){
      h += '<button class="opt" data-i="'+i+'">'+(q.type==='ox'?esc(o):circled(i)+' '+esc(o))+'</button>';
    });
    return h + '</div><div class="fb"></div></div>';
  }
  function paintQuiz(el, q, calm, fresh){
    var a = answers[q.id], opts = el.querySelectorAll('.opt'), fb = el.querySelector('.fb');
    Array.prototype.forEach.call(opts,function(o,i){
      o.classList.remove('right','wrong'); o.disabled = !!a;
      if(a){ if(i===q.answer) o.classList.add('right'); else if(i===a.c) o.classList.add('wrong'); }
    });
    if(!a){ fb.className='fb'; fb.innerHTML=''; el.classList.remove('done-ok'); return; }
    var ans = q.type==='ox' ? q.options[q.answer] : circled(q.answer)+' '+q.options[q.answer];
    fb.className = 'fb on';
    fb.innerHTML = (a.ok ? '<span class="res ok">'+(calm?'정답입니다.':'정답입니다!')+'</span>'
                         : '<span class="res no">아쉽습니다. 정답은 '+esc(ans)+'입니다.</span>')
      + '<button class="again">다시 풀기</button><div>'+esc(q.explain)+'</div>';
    fb.querySelector('.again').onclick = function(){ delete answers[q.id]; save('rokmc_quiz', answers); paintQuiz(el,q,calm); refreshTop(); };
    if(fresh && a.ok) el.classList.add('done-ok');
  }
  function bindQuizzes(root, b){
    var calm = !!b.memorial;
    Array.prototype.forEach.call(root.querySelectorAll('.quiz'),function(el){
      var q = b.quizzes.filter(function(x){ return x.id===el.getAttribute('data-q'); })[0];
      paintQuiz(el,q,calm);
      Array.prototype.forEach.call(el.querySelectorAll('.opt'),function(o){
        o.onclick = function(){
          var c = +o.getAttribute('data-i');
          answers[q.id] = {c:c, ok:c===q.answer}; save('rokmc_quiz', answers);
          paintQuiz(el,q,calm,true); refreshTop(); checkBadge();
        };
      });

  function paintDec(el, d){
    var mine = decAns[d.id], btns = el.querySelectorAll('.dopt'), res = el.querySelector('.dres');
    Array.prototype.forEach.call(btns,function(btn,i){
      btn.disabled = mine!=null; btn.classList.remove('mine','actual');
      var old = btn.querySelectorAll('.tag'); Array.prototype.forEach.call(old,function(t){ t.remove(); });
      if(mine!=null){
        if(i===mine){ btn.classList.add('mine'); btn.insertAdjacentHTML('beforeend','<span class="tag me">내 선택</span>'); }
        if(i===d.actual){ btn.classList.add('actual'); btn.insertAdjacentHTML('beforeend','<span class="tag">실제 결심</span>'); }
      }
    });
    if(mine==null){ res.className='dres'; res.innerHTML=''; return; }
    var my = d.options[mine], same = mine===d.actual;

    res.innerHTML = (my.note?'<p>'+esc(my.note)+'</p>':'')
      + '<p><b>'+(same?'실제 지휘관도 같은 판단을 했습니다.':'실제 결심은 '+'ABC'.charAt(d.actual)+'였습니다.')+'</b> '+esc(d.result)+'</p>'

  }
  function buildSlides(b){
    var s = [], c = cover(b), A = AUDS[aud], mq = myQuizzes(b), md = myDecisions(b), calm = !!b.memorial;
    s.push({h:'<div class="slide cover" style="background-image:url(\''+(c?esc(c.file):'')+'\')"><div class="kicker">'+esc(b.war)+' · '+esc(period(b))+'</div><h2>'+esc(b.name)+'</h2><p>'+esc(b.oneLine)+'</p>'

    s.push({h:'<div class="slide"><h2>개요</h2><ul><li>장소: '+esc(b.place)+'</li><li>참전 부대: '+esc(b.units)+'</li></ul>'+paras(b.summary)+'</div>'});
    md.filter(function(d){return d.after===0;}).forEach(function(d){ s.push({h:decSlide(d,calm), d:d}); });
    b.steps.forEach(function(st,k){

      md.filter(function(d){return d.after===k+1;}).forEach(function(d){ s.push({h:decSlide(d,calm), d:d}); });
      mq.filter(function(q){return q.after===k+1;}).forEach(function(q){ s.push({h:quizSlide(q), q:q}); });

  function reveal(){
    var q = slides[cur].q, d = slides[cur].d; if(!q && !d) return;
    revealed = true;

      Array.prototype.forEach.call(stage.querySelectorAll('.so'),function(el){ el.classList.add('revealed'); });
      var act = stage.querySelector('.so[data-i="'+d.actual+'"]'); if(act) act.classList.add('actual');
    }
    var so = q && stage.querySelector('.so[data-i="'+q.answer+'"]'); if(so) so.classList.add('right');
    stage.querySelector('.sexp').classList.add('on');
    var hint = stage.querySelector('.hint'); if(hint) hint.textContent = '';
  }
  function show(){
    revealed = false;

    document.getElementById('prog').style.width = ((cur+1)/slides.length*100)+'%';
  }
  function go(d){
    if(d>0 && (slides[cur].q || slides[cur].d) && !revealed){ reveal(); return; }
    var n = Math.max(0,Math.min(slides.length-1,cur+d)); if(n!==cur){ cur=n; show(); }
  }

      if(['ArrowRight','PageDown',' ','Enter'].indexOf(e.key)>=0){ e.preventDefault(); go(1); }
      else if(['ArrowLeft','PageUp','Backspace'].indexOf(e.key)>=0){ e.preventDefault(); go(-1); }
      else if(e.key==='Home'){ cur=0; show(); }
      else if(e.key==='End'){ cur=slides.length-1; show(); }
      else if(e.key==='Escape'){ closeEdu(); }
    } else if(e.key==='Escape'){ closeLb(); closeModal(); tip.style.display='none'; }
  });

  function route(){
    closeLb(); closeModal(); tip.style.display='none';
    document.body.classList.remove('calm');
    var m = location.hash.match(/^#\/b\/(.+)$/);
    if(location.hash==='#/log') renderLog();
    else if(location.hash==='#/who' || !aud) renderWho();
    else if(m) renderBattle(decodeURIComponent(m[1]));
    else renderTimeline();
    refreshTop();
  }
  window.addEventListener('hashchange',route);
  route();
  (function(){
    var n = parseInt(QS.edu, 10), m = location.hash.match(/^#\/b\/(.+)$/);
    if(!n || !m || !aud) return;
    var b = B.filter(function(x){ return x.id===decodeURIComponent(m[1]); })[0]; if(!b) return;
    openEdu(b); cur = Math.max(0, Math.min(slides.length-1, n-1)); show();
    if(QS.reveal) reveal();
  })();
})();
</script>
</body>
</html>
